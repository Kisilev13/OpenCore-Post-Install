schema_version: "1.0"
review:
  name: "Hotcoin public-scope security review"
  authorization_ack:
    granted_by: "workspace owner"
    granted_on: "2026-10-01"
    statement: >-
      Authorization is limited to the public targets and program rules supplied
      by the workspace owner. Testing must be non-destructive, use only the
      researcher's own accounts and data, and remain within the listed scope.
targets:
  include:
    - url: "https://www.hotcoin.com"
      type: "web"
      severity: "critical"
    - url: "https://play.google.com/store/apps/details?id=com.pro.hot"
      package: "com.pro.hot"
      type: "android"
      severity: "critical"
    - url: "https://apps.apple.com/us/app/hotcoin-buy-bitcoin-crypto/id6443757275"
      app_id: "6443757275"
      type: "ios"
      severity: "critical"
  exclude:
    - "third-party applications and assets not owned by Hotcoin"
    - "denial of service, social engineering, phishing, fraud, and spam"
    - "automated vulnerability scanners and high-volume traffic"
    - "testing that accesses or modifies another user's data"
    - "mobile testing requiring physical access, root, or jailbreak"
    - "out-of-scope vulnerability classes listed in the supplied policy"
network:
  passive_retrieval_allowed:
    - "listed public targets and their first-party static assets"
    - "official application-store metadata"
  automated_scanning: false
testing:
  destructive_or_persistent_actions: false
  denial_of_service_or_resource_exhaustion: false
  third_party_targets: false
  other_user_data: false
  spam_or_bulk_account_creation: false
reporting:
  automatic_submission: false
  public_disclosure: false
  report_deadline_after_discovery_hours: 24
  channel: "hackenproof.com"
  runnable_poc_required: true
  manual_owner_review_required: true
